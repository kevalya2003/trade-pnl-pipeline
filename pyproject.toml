[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tradepnl"
version = "0.1.0"
description = "Trade and PnL data pipeline: idempotent ingestion and SQL aggregation over PostgreSQL"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "SQLAlchemy>=2.0,<3.0",
    "psycopg[binary]>=3.1",
    "click>=8.1",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.4",
]

[project.scripts]
tradepnl = "tradepnl.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tradepnl = ["sql/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's whole parameter-declaration style is calls in argument defaults, so B008
# fires on correct code. Exempting the specific callables is better than disabling
# the rule, which still catches a genuine mutable default elsewhere.
extend-immutable-calls = ["fastapi.Query", "fastapi.Path", "fastapi.Body", "fastapi.Depends"]
