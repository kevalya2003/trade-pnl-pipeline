name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    # A service container rather than a mocked database. The pipeline leans on
    # PostgreSQL specifics -- ON CONFLICT, DISTINCT ON, window frames -- so testing
    # against anything else would be testing a system we do not ship.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: trades
          POSTGRES_PASSWORD: trades
          POSTGRES_DB: trades
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U trades -d trades"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TRADEPNL_TEST_DATABASE_URL: postgresql+psycopg://trades:trades@localhost:5432/trades
      # Fail loudly if the database is missing, rather than skipping the tests that
      # matter and reporting a green build.
      TRADEPNL_REQUIRE_DB: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests

      - name: Test
        run: pytest -v

      - name: End-to-end smoke run
        env:
          TRADEPNL_DATABASE_URL: postgresql+psycopg://trades:trades@localhost:5432/trades
        run: tradepnl demo --count 5000
