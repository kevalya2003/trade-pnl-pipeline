name: tradepnl

services:
  postgres:
    image: postgres:16-alpine
    container_name: tradepnl-postgres
    environment:
      POSTGRES_USER: trades
      POSTGRES_PASSWORD: trades
      POSTGRES_DB: trades
    ports:
      # Deliberately not 5432 on the host: a developer machine very often already has
      # a PostgreSQL listening there, and a port clash is a confusing first experience.
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trades -d trades"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
